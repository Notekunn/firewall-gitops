variables:
  OPENTOFU_VERSION: '1.12.6'
  TF_ROOT: '${CI_PROJECT_DIR}/terraform'
  STATE_GENERATION:
    value: 'v1'
    options: ['v1', 'v2']
    description: 'Use v2 only during reviewed state adoption/cutover'
  GITLAB_API_URL: '${CI_API_V4_URL}'
  GITLAB_PROJECT_ID: '${CI_PROJECT_ID}'
  GITLAB_USERNAME: 'gitlab-ci-token'
  GITLAB_PASSWORD: '${CI_JOB_TOKEN}'

stages: [validate, plan, apply]

.tofu-base:
  image:
    name: opentofu/opentofu:$OPENTOFU_VERSION
    entrypoint: ['']
  cache:
    key: '${CI_COMMIT_REF_SLUG}-${CLUSTER_NAME}'
    paths: ['${TF_ROOT}/.terraform']
  before_script:
    - apk add --no-cache python3 py3-yaml py3-jsonschema tzdata

validate-yaml:
  stage: validate
  image: python:3.11-alpine
  before_script: ['pip install -r requirements.txt']
  script: ['python3 scripts/validate_yaml.py']

tofu-format:
  extends: .tofu-base
  stage: validate
  variables: {CLUSTER_NAME: 'fw-core'}
  script: ['./scripts/deploy.sh -c "$CLUSTER_NAME" -a fmt']

tofu-validate:
  extends: .tofu-base
  stage: validate
  variables: {CLUSTER_NAME: 'fw-core'}
  script:
    - cd "$TF_ROOT"
    - tofu init -backend=false -lockfile=readonly -input=false
    - tofu validate

security-scan:
  stage: validate
  image:
    name: bridgecrew/checkov:latest
    entrypoint: ['']
  script:
    - checkov -d terraform/ --framework terraform --output cli --quiet
    - checkov -d modules/ --framework terraform --output cli --quiet
  allow_failure: true

.plan:
  extends: .tofu-base
  stage: plan
  resource_group: 'firewall-${CLUSTER_NAME}'
  script: ['./scripts/deploy.sh -c "$CLUSTER_NAME" -a plan --state-generation "$STATE_GENERATION"']
  artifacts:
    name: 'tofu-plan-${CLUSTER_NAME}-${STATE_GENERATION}'
    paths: ['terraform/plan-*.tfplan', 'terraform/plan-*.json']
    access: maintainer
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.apply:
  extends: .tofu-base
  stage: apply
  resource_group: 'firewall-${CLUSTER_NAME}'
  when: manual
  allow_failure: false
  script: ['./scripts/deploy.sh -c "$CLUSTER_NAME" -a apply --state-generation "$STATE_GENERATION"']
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

plan-fw-core:
  extends: .plan
  variables: {CLUSTER_NAME: 'fw-core'}

apply-fw-core:
  extends: .apply
  variables: {CLUSTER_NAME: 'fw-core'}
  dependencies: [plan-fw-core]

plan-fw-mgmt:
  extends: .plan
  variables: {CLUSTER_NAME: 'fw-mgmt'}

apply-fw-mgmt:
  extends: .apply
  variables: {CLUSTER_NAME: 'fw-mgmt'}
  dependencies: [plan-fw-mgmt]

plan-fw-out:
  extends: .plan
  variables: {CLUSTER_NAME: 'fw-out'}

apply-fw-out:
  extends: .apply
  variables: {CLUSTER_NAME: 'fw-out'}
  dependencies: [plan-fw-out]
