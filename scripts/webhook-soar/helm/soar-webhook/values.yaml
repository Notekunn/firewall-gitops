# Default values for soar-webhook.

replicaCount: 2

image:
  repository: soar-webhook-service
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}

podLabels:
  app.kubernetes.io/name: soar-webhook
  app.kubernetes.io/component: webhook

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: webhook.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: webhook-tls
  #    hosts:
  #      - webhook.example.com

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Application configuration
config:
  gitlab:
    url: ""  # Required: e.g., https://gitlab.example.com
    projectId: ""  # Required: numeric ID
    branch: "main"
  yaml:
    filePath: ""  # Required: e.g., clusters/prod/objects.yaml
    objectPath: "addresses"
  server:
    port: "8080"

# Secret configuration
secrets:
  gitlabToken: ""  # Required: GitLab personal access token

# Additional environment variables
env: []

# Additional volumes (for config maps, secrets, etc.)
volumes: []

# Additional volume mounts
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}