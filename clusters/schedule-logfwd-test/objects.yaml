# Test objects: schedules + rule-level schedule/log_setting refs

schedules:
  - name: business-hours
    schedule_type:
      recurring:
        weekly:
          monday: ['09:00-17:00']
          tuesday: ['09:00-17:00']
          wednesday: ['09:00-17:00']
          thursday: ['09:00-17:00']
          friday: ['09:00-17:00']

  - name: maintenance-window
    schedule_type:
      non_recurring:
        - '2026/05/01@00:00-2026/05/02@06:00'

addresses:
  - name: 'test-web-server'
    description: 'Test web server address'
    ip_netmask: '192.168.1.10/32'
    tags: ['test', 'web']

  - name: 'test-database-server'
    description: 'Test database server address'
    ip_netmask: '192.168.1.20/32'
    tags: ['test', 'database']

  - name: 'external-api'
    description: 'External API service'
    fqdn: 'api.example.com'
    tags: ['external', 'api']

services:
  - name: 'https-traffic'
    description: 'HTTPS web traffic'
    type: 'tcp'
    destination_port: '443'
    source_port: '1024-65535'
    tags: ['web', 'encrypted']

  - name: 'database-traffic'
    description: 'Database traffic'
    type: 'tcp'
    destination_port: '3306'
    source_port: '1024-65535'
    tags: ['database']

rules:
  - name: 'allow-business-hours-web'
    description: 'Allow HTTPS outbound only during business hours'
    rule_type: 'universal'
    source_zones: ['trust']
    destination_zones: ['untrust']
    source_addresses: ['test-web-server']
    destination_addresses: ['external-api']
    applications: ['web-browsing', 'ssl']
    services: ['https-traffic']
    schedule: 'business-hours'
    log_setting: 'siem-fwd-profile'
    action: 'allow'
    log_start: false
    log_end: true
    tags: ['test', 'outbound']

  - name: 'allow-db-access-default-logfwd'
    description: 'DB access; log_setting falls back to cluster global'
    rule_type: 'universal'
    source_zones: ['trust']
    destination_zones: ['trust']
    source_addresses: ['test-web-server']
    destination_addresses: ['test-database-server']
    applications: ['mysql']
    services: ['database-traffic']
    action: 'allow'
    log_start: true
    log_end: true
    tags: ['test', 'internal']
