# Test cluster: PAN-OS schedule + log_setting wiring
cluster:
  name: 'schedule-logfwd-test'
  environment: test

firewall:
  type: 'palo-alto'

  # Standalone firewall configuration
  standalone:
    ngfw_device: 'firewall-test.example.com'
    vsys_name: 'vsys1'

  auto_commit:
    enabled: false
    commit_description: 'Test: schedule + log_setting'

  # Global log forwarding profile fallback (refs pre-existing profile on firewall)
  log_setting: 'default-fwd-profile'

# Rule positioning - add rules at the top for testing
position:
  where: 'first'
