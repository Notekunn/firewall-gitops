addresses:
  - name: 'core-host'
    ip_netmask: '172.25.1.5/32'
  - name: 'mgmt-host'
    ip_netmask: '172.25.10.5/32'

services:
  - name: 'tcp-22'
    type: 'tcp'
    destination_port: '22'
    source_port: '1024-65535'

rules:
  - name: 'allow-core-mgmt-ssh'
    source_zones: ['uplink']
    destination_zones: ['mgmt']
    source_addresses: ['core-host']
    destination_addresses: ['mgmt-host']
    applications: ['any']
    services: ['tcp-22']
    action: 'Accept'
    log_end: true
