# Test Cluster Configuration for PAN-OS Log Forwarding Profiles Phase 2
cluster:
  name: 'log-profile-test'
  environment: test

firewall:
  type: 'palo-alto'

  # Standalone firewall configuration
  standalone:
    ngfw_device: 'firewall-test.example.com'
    vsys_name: 'vsys1'

  auto_commit:
    enabled: false
    commit_description: 'Test configuration for log forwarding profiles'

  # Log forwarding profiles under firewall section (per schema)
  log_forwarding_profiles:
    - name: 'siem-forwarding'
      description: 'Forward all critical logs to SIEM system'
      match_list:
        - name: 'traffic-logs'
          log_type: 'traffic'
          send_to_panorama: false
          syslog_profiles: ['siem-syslog-server']
        - name: 'threat-logs'
          log_type: 'threat'
          send_to_panorama: false
          syslog_profiles: ['siem-syslog-server']
          email_profiles: ['security-team-email']
        - name: 'wildfire-logs'
          log_type: 'wildfire'
          send_to_panorama: true

    - name: 'panorama-central'
      description: 'Send logs to Panorama for centralized analysis'
      match_list:
        - name: 'all-threat-logs'
          log_type: 'threat'
          send_to_panorama: true
        - name: 'url-logs'
          log_type: 'url'
          send_to_panorama: true
        - name: 'data-logs'
          log_type: 'data'
          send_to_panorama: false
          http_profiles: ['data-analysis-server']


# Rule positioning - add rules at the top for testing
position:
  where: 'first'