# Test Cluster Configuration without log forwarding profiles
cluster:
  name: 'no-profile-test'
  environment: test

firewall:
  type: 'palo-alto'

  # Standalone firewall configuration
  standalone:
    ngfw_device: 'firewall-test.example.com'
    vsys_name: 'vsys1'

  auto_commit:
    enabled: false
    commit_description: 'Test configuration without log forwarding profiles'

# Rule positioning - add rules at the top for testing
position:
  where: 'first'